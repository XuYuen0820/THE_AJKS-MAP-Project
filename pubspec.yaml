name: map_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.4.0
  firebase_core: ^5.1.0
  cloud_firestore: ^7.1.0
  image_picker: ^1.2.0
  firebase_auth: ^7.1.0
  get_it: ^8.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/exora_icon.jpg"
  adaptive_icon_background: "#1B1E6E"
  adaptive_icon_foreground: "assets/images/exora_icon.jpg"

flutter:
  uses-material-design: true

  assets:
    - assets/images/